name: Publish ZimaOS Image

on:
  # Auto-trigger when CI completes successfully on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger is kept for emergency deploys but is guarded by the CI-green check below.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-zima:
    # For workflow_run: only proceed if CI passed on main branch.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SOURCE_SHA="${{ github.sha }}"
          fi

          if [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: unable to resolve source SHA"
            exit 1
          fi

          echo "Event: ${{ github.event_name }}"
          echo "CI run ID: ${{ github.event.workflow_run.id || 'N/A' }}"
          echo "CI head SHA: ${{ github.event.workflow_run.head_sha || 'N/A' }}"
          echo "CI head branch: ${{ github.event.workflow_run.head_branch || 'N/A' }}"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion || 'N/A' }}"
          echo "Resolved SOURCE_SHA: $SOURCE_SHA"

          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout R3.1-ZIMA baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive

      # Guard for manual workflow_dispatch: verify CI is green on the exact SHA being published.
      # Treats legitimate skipped and neutral jobs (e.g. release-ghcr) as non-failures.
      - name: Guard — verify CI is green on this SHA (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SHA="${{ steps.source.outputs.sha }}"
          REPO="${{ github.repository }}"

          echo "Verifying CI status for SHA: ${SHA}"

          STATUS=$(gh api \
            "repos/${REPO}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name != "Publish ZimaOS Image")] | 
                  if length == 0 then "no_checks"
                  elif any(.[]; .status != "completed") then "pending"
                  elif any(.[]; .conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure" or .conclusion == "stale") then "failure"
                  elif all(.[]; .conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") then "success"
                  else "failure"
                  end')

          echo "CI check status: ${STATUS}"

          if [ "${STATUS}" = "no_checks" ]; then
            echo "ERROR: No CI check runs found for SHA ${SHA}."
            echo "       Run the CI workflow first, or use a SHA that has passed CI."
            exit 1
          fi

          if [ "${STATUS}" != "success" ]; then
            echo "ERROR: CI is not green for SHA ${SHA} (status: ${STATUS})."
            echo "       Resolve all failing checks before publishing the ZimaOS image."
            exit 1
          fi

          echo "CI is green for SHA ${SHA}. Proceeding with publish."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ZimaOS image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pitydah/michi-micro-server:r3.1-zima
            ghcr.io/pitydah/michi-micro-server:r3.1-zima-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pitydah/michi-micro-server
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record certification image digest
        run: |
          echo "### ZimaOS Release Image Certification" >> $GITHUB_STEP_SUMMARY
          echo "- **Source SHA**: \`${{ steps.source.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pinned URI**: \`ghcr.io/pitydah/michi-micro-server@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Certified digest: ${{ steps.build.outputs.digest }}"

