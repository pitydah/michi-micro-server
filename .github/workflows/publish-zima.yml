name: Publish ZimaOS Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-zima:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout R3.1-ZIMA baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ZimaOS image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pitydah/michi-micro-server:r3.1-zima
            ghcr.io/pitydah/michi-micro-server:r3.1-zima-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pitydah/michi-micro-server
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record certification image digest
        run: |
          echo "### ZimaOS Release Image Certification" >> $GITHUB_STEP_SUMMARY
          echo "- **Source SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pinned URI**: \`ghcr.io/pitydah/michi-micro-server@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Certified digest: ${{ steps.build.outputs.digest }}"
