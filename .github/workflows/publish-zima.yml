name: Publish ZimaOS Image

on:
  # Auto-trigger when CI completes successfully on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger is kept for emergency deploys but is guarded by the CI-green check below.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-zima:
    # For workflow_run: only proceed if CI passed on main branch.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SOURCE_SHA="${{ github.sha }}"
          fi

          if [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: unable to resolve source SHA"
            exit 1
          fi

          echo "Event: ${{ github.event_name }}"
          echo "CI run ID: ${{ github.event.workflow_run.id || 'N/A' }}"
          echo "CI head SHA: ${{ github.event.workflow_run.head_sha || 'N/A' }}"
          echo "CI head branch: ${{ github.event.workflow_run.head_branch || 'N/A' }}"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion || 'N/A' }}"
          echo "Resolved SOURCE_SHA: $SOURCE_SHA"

          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout R3.1-ZIMA baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive

      # Mandatory Guard: verify CI is 100% green on the exact SHA being published across all required gates
      - name: Guard — verify CI is 100% green on this exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SHA="${{ steps.source.outputs.sha }}"
          REPO="${{ github.repository }}"

          echo "Verifying CI workflow runs for SHA: ${SHA}"

          RUN_JSON=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0] // empty')

          if [ -z "${RUN_JSON}" ]; then
            echo "ERROR: No completed CI workflow runs found for SHA ${SHA}."
            echo "       Run the CI workflow first, or use a SHA that has passed CI."
            exit 1
          fi

          RUN_CONCLUSION=$(echo "${RUN_JSON}" | jq -r '.conclusion // "unknown"')
          RUN_ID=$(echo "${RUN_JSON}" | jq -r '.id')

          echo "Latest CI workflow run: ID=${RUN_ID}, conclusion=${RUN_CONCLUSION}"

          if [ "${RUN_CONCLUSION}" != "success" ]; then
            echo "ERROR: CI is not green for SHA ${SHA} (conclusion: ${RUN_CONCLUSION}, run: ${RUN_ID})."
            echo "       Resolve all failing checks before publishing the ZimaOS image."
            exit 1
          fi

          # Verify that all 15 required certification gates exist and completed with success
          REQUIRED_GATES=(
            "ci-rust"
            "ci-stream-contract"
            "ci-receiver-contract-simulator"
            "ci-snapcast-contract-mock"
            "ci-mqtt-contract-simulator"
            "ci-mosquitto-real"
            "ci-generic-linux-appliance"
            "ci-reliability-short"
            "ci-web-ui-functional-integrity"
            "ci-web-ui-browser-e2e"
            "ci-no-test-api-release"
            "ci-three-way-ecosystem"
            "ci-docker-amd64"
            "ci-arm64-qemu"
            "ci-zimaos-package"
          )

          JOBS_JSON=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs')

          ERRORS=()
          for GATE in "${REQUIRED_GATES[@]}"; do
            CONCLUSION=$(echo "${JOBS_JSON}" | jq -r --arg name "$GATE" '
              [.[] | select(.name == $name)][0] | if . == null then "MISSING" else .conclusion end
            ')
            if [ "$CONCLUSION" != "success" ]; then
              ERRORS+=("${GATE}: ${CONCLUSION}")
            fi
          done

          if [ ${#ERRORS[@]} -gt 0 ]; then
            echo "ERROR: Not all required certification gates succeeded for run ${RUN_ID}:"
            for ERR in "${ERRORS[@]}"; do
              echo "  - ${ERR}"
            done
            exit 1
          fi

          echo "CI run ${RUN_ID} is 100% green across all 15 required gates for SHA ${SHA}. Proceeding with publish."

      - name: Set up Python for Store Package Builder
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Store Package Dependencies
        run: pip install -r requirements-zima.txt

      - name: Build and Validate ZimaOS App Store Package Distribution
        run: |
          set -euo pipefail
          python3 scripts/build_zimaos_store.py

      - name: Upload ZimaOS App Store package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zimaos-store-package-${{ steps.source.outputs.sha }}
          path: dist/
          retention-days: 90

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable SHA ZimaOS image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:r3.1-zima-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pitydah/michi-micro-server
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update mutable r3.1-zima alias if still on main HEAD (LAST STEP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.source.outputs.sha }}"
          REPO="${{ github.repository }}"
          MAIN_HEAD=$(gh api "repos/${REPO}/commits/main" --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$MAIN_HEAD" ] && [ "$SHA" = "$MAIN_HEAD" ]; then
            echo "Source SHA $SHA matches current main HEAD ($MAIN_HEAD). Updating mutable alias r3.1-zima..."
            docker buildx imagetools create \
              --tag "ghcr.io/${REPO}:r3.1-zima" \
              "ghcr.io/${REPO}:r3.1-zima-${SHA}"
            echo "Successfully updated ghcr.io/${REPO}:r3.1-zima to point to digest ${{ steps.build.outputs.digest }}"
          else
            echo "Source SHA $SHA is not current main HEAD ($MAIN_HEAD). Skipping mutable alias update to prevent rollback."
          fi

      - name: Record certification image digest and packaging summary
        run: |
          echo "### ZimaOS Release Image & App Package Certification" >> $GITHUB_STEP_SUMMARY
          echo "- **Source SHA**: \`${{ steps.source.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pinned URI**: \`ghcr.io/pitydah/michi-micro-server@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **App Package**: \`dist/apps/io.michi.micro-server/\` (ID: \`io.michi.micro-server\`, Version: \`3.1\`)" >> $GITHUB_STEP_SUMMARY
          echo "Certified digest: ${{ steps.build.outputs.digest }}"


