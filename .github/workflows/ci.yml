  ci-web-ui-browser-e2e:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and pytest
        run: |
          pip install pytest playwright
          playwright install --with-deps chromium
      - name: Build michi-server
        run: cargo build --bin michi-server
      - name: Run WebUI Browser E2E Suite
        run: |
          set -euo pipefail

          TEST_ROOT="${RUNNER_TEMP}/michi-browser-e2e"
          rm -rf "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}/config" "${TEST_ROOT}/cache" "${TEST_ROOT}/music"

          python3 -c "import wave, struct; f = wave.open('${TEST_ROOT}/music/fixture.wav', 'w'); f.setnchannels(1); f.setsampwidth(2); f.setframerate(8000); f.writeframes(b'\x00\x00' * 8000 * 120); f.close()"

          export MICHI_CONFIG_PATH="${TEST_ROOT}/config"
          export MICHI_CACHE_PATH="${TEST_ROOT}/cache"
          export MICHI_MUSIC_PATH="${TEST_ROOT}/music"
          export MICHI_DATABASE="sqlite://${TEST_ROOT}/config/michi.db"
          export MICHI_PORT=9090
          export MICHI_AUTH_USERNAME=admin
          export MICHI_AUTH_PASSWORD=admin12345
          export MICHI_RATE_LIMIT_RPS=100
          export MICHI_RATE_LIMIT_BURST=300
          export MICHI_LOGIN_RATE_LIMIT_PER_MINUTE=100

          ./target/debug/michi-server &
          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "FAIL: michi-server died before becoming healthy"
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: michi-server did not become healthy within timeout"
            exit 1
          fi

          # Seed library and wait for track indexing before executing action effects
          python3 -c '
          import urllib.request, json, time
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor())
          login_data = json.dumps({"username": "admin", "password": "admin12345"}).encode()
          req = urllib.request.Request("http://127.0.0.1:9090/api/auth/login", data=login_data, headers={"Content-Type": "application/json"}, method="POST")
          opener.open(req)
          scan_req = urllib.request.Request("http://127.0.0.1:9090/api/v1/library/scan", data=b"{}", headers={"Content-Type": "application/json"}, method="POST")
          opener.open(scan_req)
          for _ in range(30):
              time.sleep(0.5)
              tracks_req = urllib.request.Request("http://127.0.0.1:9090/api/v1/tracks?limit=1")
              try:
                  with opener.open(tracks_req) as r:
                      data = json.loads(r.read())
                      tracks = data if isinstance(data, list) else data.get("tracks", [])
                      if len(tracks) > 0:
                          print(f"Library scanned: {len(tracks)} track(s) ready")
                          break
              except Exception:
                  pass
          '

          MICHI_SERVER_URL=http://127.0.0.1:9090 \
          MICHI_ADMIN_USERNAME=admin \
          MICHI_ADMIN_PASSWORD=admin12345 \
          pytest tests/e2e/test_webui_action_effects.py -v

          MICHI_SERVER_URL=http://127.0.0.1:9090 \
          MICHI_ADMIN_USERNAME=admin \
          MICHI_ADMIN_PASSWORD=admin12345 \
          pytest tests/e2e/test_scrobble_integrations.py -v

          MICHI_SERVER_URL=http://127.0.0.1:9090 \
          MICHI_ADMIN_USERNAME=admin \
          MICHI_ADMIN_PASSWORD=admin12345 \
          pytest tests/e2e/test_webui_browser_e2e.py -v

          MICHI_SERVER_URL=http://127.0.0.1:9090 \
          MICHI_ADMIN_USERNAME=admin \
          MICHI_ADMIN_PASSWORD=admin12345 \
          pytest tests/e2e/test_webui_functional_conformance.py -v
      - name: Record release evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate web-ui-browser-e2e \
            --class INTEGRATION_REAL \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/web-ui-browser-e2e.json
          python3 scripts/record_job_evidence.py \
            --gate web-ui-action-effects \
            --class INTEGRATION_REAL \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/web-ui-action-effects.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-web-ui-browser-e2e
          path: |
            target/release-evidence/web-ui-browser-e2e.json
            target/release-evidence/web-ui-action-effects.json
          if-no-files-found: error
          retention-days: 30

