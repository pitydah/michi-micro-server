  ci-docker-amd64:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-no-test-api-release, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-web-ui-browser-e2e, ci-three-way-ecosystem]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: michi-server:test
      - name: Smoke test and Player Contract verification
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f michi-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name michi-test \
            -p 9090:9090 \
            --tmpfs /music:rw,uid=1000,gid=1000,mode=0775 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e MICHI_PORT=9090 \
            -e MICHI_AUTH_USERNAME=admin \
            -e MICHI_AUTH_PASSWORD=admin123 \
            michi-server:test

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: container did not become healthy within timeout"
            docker logs michi-test
            exit 1
          fi

          curl -fsS http://127.0.0.1:9090/health/live >/dev/null
          curl -fsS http://127.0.0.1:9090/api/v1/status >/dev/null
          curl -fsS http://127.0.0.1:9090/ >/dev/null
          python3 tests/e2e/test_player_micro_contract_compatibility.py \
            --url http://127.0.0.1:9090 \
            --username admin \
            --password admin123
      - name: Record release evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate docker-amd64 \
            --class CONTAINER_NATIVE \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/docker-amd64.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-docker-amd64
          path: target/release-evidence/docker-amd64.json
          if-no-files-found: error
          retention-days: 30

  ci-arm64-qemu:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-web-ui-browser-e2e, ci-three-way-ecosystem]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: michi-server:arm64
      - name: Verify ARM64 runtime and Player Contract under QEMU
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f michi-arm64 >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d \
            --name michi-arm64 \
            -p 9091:9091 \
            --tmpfs /music:rw,uid=1000,gid=1000,mode=0775 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e MICHI_PORT=9091 \
            -e MICHI_AUTH_USERNAME=admin \
            -e MICHI_AUTH_PASSWORD=admin123 \
            michi-server:arm64

          READY=0

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9091/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx michi-arm64; then
              echo "FAIL: ARM64 container terminated before becoming healthy"
              docker logs michi-arm64 || true
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: ARM64 container did not become healthy within timeout"
            docker logs michi-arm64 || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:9091/health/live >/dev/null
          curl -fsS http://127.0.0.1:9091/api/v1/status >/dev/null
          curl -fsS http://127.0.0.1:9091/ >/dev/null

          docker exec michi-arm64 sh -lc '
            echo "Effective runtime:"
            id
            echo "/music ownership:"
            stat -c "%u:%g %a" /music
            echo "Writable /music check:"
            touch /music/.ci-write-test
            rm /music/.ci-write-test
          '

          python3 tests/e2e/test_player_micro_contract_compatibility.py \
            --url http://127.0.0.1:9091 \
            --username admin \
            --password admin123
      - name: Record release evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate arm64-qemu \
            --class EMULATED_ARCH \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/arm64-qemu.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-arm64-qemu
          path: target/release-evidence/arm64-qemu.json
          if-no-files-found: error
          retention-days: 30

  ci-zimaos-package:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-zima.txt
      - name: Validate and build ZimaOS App Store Package
        run: python3 scripts/build_zimaos_store.py
      - name: Assert ZimaOS store distribution integrity
        run: |
          test -f dist/index.json
          test -f dist/store.json
          test -f dist/apps/io.michi.micro-server/docker-compose.yml
          test -f dist/apps/io.michi.micro-server/meta.json
          test -s dist/apps/io.michi.micro-server/assets/icon.svg
          test -s dist/apps/io.michi.micro-server/assets/thumbnail.png
          python3 - <<'PY'
          import json
          import tomllib

          with open("Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)

          expected_version = cargo["workspace"]["package"]["version"]

          with open("dist/index.json") as f:
              data = json.load(f)

          app = data["apps"][0]
          assert app["id"] == "io.michi.micro-server"
          assert app["scheme"] == "http"
          assert data["version"] == "3.1"
          assert app["version"] == expected_version, (app["version"], expected_version)
          assert "content_hash" in app and len(app["content_hash"]) == 64

          with open("dist/store.json") as f:
              store_v2 = json.load(f)

          assert store_v2["version"] == 2
          assert store_v2["store_id"] == "io.michi.store"
          assert store_v2["apps"][0]["id"] == "io.michi.micro-server"
          assert store_v2["apps"][0]["version"] == expected_version
          PY

      - name: Record release evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate zimaos-package \
            --class STATIC_ANALYSIS \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/zimaos-package.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-zimaos-package
          path: target/release-evidence/zimaos-package.json
          if-no-files-found: error
          retention-days: 30

  ci-upgrade-backup-restore:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config sqlite3
      - name: Build release binary
        run: cargo build --release --bin michi-server
      - name: Run Upgrade, Migration and Backup/Restore Disaster Recovery Gate
        run: bash scripts/test_upgrade_and_backup_restore.sh 9097
      - name: Record release evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate upgrade-backup-restore \
            --class INTEGRATION_REAL \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/upgrade-backup-restore.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-upgrade-backup-restore
          path: target/release-evidence/upgrade-backup-restore.json
          if-no-files-found: error
          retention-days: 30

  ci-hls-vod-real:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsqlite3-dev pkg-config
      - name: Run real HLS VOD test
        run: |
          cargo test -p michi-streaming --test hls_real -- --nocapture
      - name: Record HLS evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate hls-vod-real \
            --class INTEGRATION_REAL \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/hls-vod-real.json
      - name: Upload HLS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-hls-vod-real
          path: target/release-evidence/hls-vod-real.json
          if-no-files-found: error
          retention-days: 30

  ci-release-gate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ci-rust
      - ci-stream-contract
      - ci-receiver-contract-simulator
      - ci-snapcast-contract-mock
      - ci-snapserver-real
      - ci-mqtt-contract-simulator
      - ci-mosquitto-real
      - ci-generic-linux-appliance
      - ci-reliability-short
      - ci-short-stability-smoke
      - ci-resource-budget
      - ci-web-ui-functional-integrity
      - ci-web-ui-browser-e2e
      - ci-web-ui-action-manifest
      - ci-three-way-ecosystem
      - ci-docker-amd64
      - ci-arm64-qemu
      - ci-zimaos-package
      - ci-upgrade-backup-restore
      - ci-hls-vod-real
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Run release gate aggregator unit tests
        run: pytest scripts/tests/test_release_gate.py -v
      - name: Verify Version and Packaging Consistency
        run: python3 scripts/check_version_consistency.py
      - name: Verify Product Truth Synchronization
        run: python3 scripts/generate_product_truth.py --check
      - name: Download release evidence
        uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: target/release-evidence
      - name: Show evidence inventory
        run: |
          find target/release-evidence -maxdepth 1 -type f -name '*.json' -print | sort
      - name: Resolve release qualification mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]] && [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "mode=ga" >> "$GITHUB_OUTPUT"
            echo "Mode: GA qualification"
          else
            echo "mode=rc" >> "$GITHUB_OUTPUT"
            echo "Mode: RC qualification"
          fi
      - name: Assert Evidence-Based Release Gates
        run: |
          python3 scripts/generate_release_gate.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --evidence-dir target/release-evidence \
            --report target/V1_RELEASE_GATE.md \
            --check
      - name: Publish calculated release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report-${{ github.sha }}
          path: target/V1_RELEASE_GATE.md
          if-no-files-found: error
          retention-days: 90
      - name: Add release report to workflow summary
        if: always()
        run: |
          if test -f target/V1_RELEASE_GATE.md; then
            cat target/V1_RELEASE_GATE.md >> "$GITHUB_STEP_SUMMARY"
          fi

  release-ghcr:
    needs: [ci-release-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Build and push multi-arch release
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ghcr-public-release:
    needs: [release-ghcr]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Anonymous Pull and Multi-Arch Runtime
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          echo "Verifying public accessibility for image: ${IMAGE}"
          ./scripts/verify_public_release_image.sh "${IMAGE}" 9090

