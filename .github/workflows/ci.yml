  ci-no-test-api-release:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Build release binary
        run: cargo build --release --bin michi-server
      - name: Verify engineering route test_pcm is 404 in release
        run: |
          set -euo pipefail

          TEST_ROOT="${RUNNER_TEMP}/michi-release-gate"

          rm -rf "${TEST_ROOT}"
          mkdir -p \
            "${TEST_ROOT}/config" \
            "${TEST_ROOT}/cache" \
            "${TEST_ROOT}/music"

          MICHI_CONFIG_PATH="${TEST_ROOT}/config" \
          MICHI_CACHE_PATH="${TEST_ROOT}/cache" \
          MICHI_MUSIC_PATH="${TEST_ROOT}/music" \
          MICHI_DATABASE="sqlite://${TEST_ROOT}/config/michi.db" \
          MICHI_PORT=9090 \
          ./target/release/michi-server &

          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          READY=0

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "FAIL: release server terminated before becoming healthy"
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: release server did not become healthy within timeout"
            exit 1
          fi

          STATUS="$(
            curl -sS \
              -o /dev/null \
              -w "%{http_code}" \
              -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:9090/api/v1/receivers/dummy/stream/test_pcm
          )"

          if [ "$STATUS" = "404" ]; then
            echo "PASS: /stream/test_pcm strictly 404 in release (status=$STATUS)"
          else
            echo "FAIL: expected 404 in release build, got $STATUS"
            exit 1
          fi

  ci-three-way-ecosystem:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-no-test-api-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Build michi-server binary
        run: cargo build --bin michi-server
      - name: Run Three-Way Ecosystem E2E Integration Suite (Mobile -> Micro -> Stream)
