name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  packages: write

jobs:
  ci-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ci-stream-contract:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate Michi Link v1-lite Stream Contract Drift & Full OpenAPI (Pinned Submodule)
        run: python3 scripts/test_stream_contract_drift.py --contract-dir vendor/michi-music-stream/contracts/michi-link

  ci-receiver-contract-simulator:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: Run Receiver Simulator E2E Integration Tests (Matrix, PIN & Fault Injection)
        run: bash scripts/test_receiver_e2e.sh 8080 8081

  ci-snapcast-contract-mock:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run Snapcast Multi-Client Contract Mock Tests
        run: bash scripts/test_snapcast_e2e.sh 1780

  ci-mqtt-contract-simulator:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Run Home Assistant & MQTT Contract Simulator Tests
        run: bash scripts/test_homeassistant_e2e.sh 18883 18884 9098

  ci-mosquitto-real:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies & Mosquitto broker
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config mosquitto
      - name: Build michi-server binary
        run: cargo build --bin michi-server
      - name: Run Mosquitto Real Integration Tests
        run: bash scripts/test_mosquitto_real_e2e.sh 18885 9098

  ci-generic-linux-appliance:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config sqlite3
      - name: Run Appliance Qualification on Generic Linux Runner
        run: bash scripts/test_appliance_e2e.sh 9092

  ci-reliability-short:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config sqlite3
      - name: Run Master Reliability & Short Stability Smoke Suite
        run: bash scripts/test_reliability_qualification.sh 9089

  ci-web-ui-functional-integrity:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
        # Rust toolchain setup
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: Run Web UI Functional Integrity Suite
        run: cargo test -p michi-api --test web_ui_integrity_tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Web UI Browser E2E Contract & Invariance Suite
        run: node scripts/test_web_ui_e2e.mjs

  ci-web-ui-browser-e2e:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and pytest
        run: |
          pip install pytest playwright
          playwright install --with-deps chromium
      - name: Build michi-server
        run: cargo build --bin michi-server
      - name: Run WebUI Browser E2E Suite
        run: |
          set -euo pipefail

          TEST_ROOT="${RUNNER_TEMP}/michi-browser-e2e"
          rm -rf "${TEST_ROOT}"
          mkdir -p "${TEST_ROOT}/config" "${TEST_ROOT}/cache" "${TEST_ROOT}/music"

          python3 -c "import wave, struct, math; f = wave.open('${TEST_ROOT}/music/fixture.wav', 'w'); f.setnchannels(2); f.setsampwidth(2); f.setframerate(48000); [f.writeframes(struct.pack('<hh', int(32767.0 * 0.3 * math.sin(2.0 * math.pi * 440.0 * i / 48000)), int(32767.0 * 0.3 * math.sin(2.0 * math.pi * 440.0 * i / 48000)))) for i in range(48000)]; f.close()"

          export MICHI_CONFIG_PATH="${TEST_ROOT}/config"
          export MICHI_CACHE_PATH="${TEST_ROOT}/cache"
          export MICHI_MUSIC_PATH="${TEST_ROOT}/music"
          export MICHI_DATABASE="sqlite://${TEST_ROOT}/config/michi.db"
          export MICHI_PORT=9090
          export MICHI_AUTH_USERNAME=admin
          export MICHI_AUTH_PASSWORD=admin12345

          ./target/debug/michi-server &
          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "FAIL: michi-server died before becoming healthy"
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: michi-server did not become healthy within timeout"
            exit 1
          fi

          MICHI_SERVER_URL=http://127.0.0.1:9090 \
          MICHI_ADMIN_USERNAME=admin \
          MICHI_ADMIN_PASSWORD=admin12345 \
          pytest tests/e2e/test_webui_browser_e2e.py -v

          MICHI_SERVER_URL=http://127.0.0.1:9090 \
          MICHI_ADMIN_USERNAME=admin \
          MICHI_ADMIN_PASSWORD=admin12345 \
          pytest tests/e2e/test_webui_functional_conformance.py -v

  ci-no-test-api-release:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Build release binary
        run: cargo build --release --bin michi-server
      - name: Verify engineering route test_pcm is 404 in release
        run: |
          set -euo pipefail

          TEST_ROOT="${RUNNER_TEMP}/michi-release-gate"

          rm -rf "${TEST_ROOT}"
          mkdir -p \
            "${TEST_ROOT}/config" \
            "${TEST_ROOT}/cache" \
            "${TEST_ROOT}/music"

          MICHI_CONFIG_PATH="${TEST_ROOT}/config" \
          MICHI_CACHE_PATH="${TEST_ROOT}/cache" \
          MICHI_MUSIC_PATH="${TEST_ROOT}/music" \
          MICHI_DATABASE="sqlite://${TEST_ROOT}/config/michi.db" \
          MICHI_PORT=9090 \
          ./target/release/michi-server &

          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          READY=0

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "FAIL: release server terminated before becoming healthy"
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: release server did not become healthy within timeout"
            exit 1
          fi

          STATUS="$(
            curl -sS \
              -o /dev/null \
              -w "%{http_code}" \
              -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:9090/api/v1/receivers/dummy/stream/test_pcm
          )"

          if [ "$STATUS" = "404" ]; then
            echo "PASS: /stream/test_pcm strictly 404 in release (status=$STATUS)"
          else
            echo "FAIL: expected 404 in release build, got $STATUS"
            exit 1
          fi


  ci-three-way-ecosystem:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-no-test-api-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Build michi-server binary
        run: cargo build --bin michi-server
      - name: Run Three-Way Ecosystem E2E Integration Suite (Mobile -> Micro -> Stream)
        run: bash scripts/test_three_way_ecosystem.sh 9099 55438 55439

  ci-docker-amd64:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-no-test-api-release, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-web-ui-browser-e2e, ci-three-way-ecosystem]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: michi-server:test
      - name: Smoke test and Player Contract verification
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f michi-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name michi-test \
            -p 9090:9090 \
            --tmpfs /music:rw,uid=1000,gid=1000,mode=0775 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e MICHI_PORT=9090 \
            -e MICHI_AUTH_USERNAME=admin \
            -e MICHI_AUTH_PASSWORD=admin123 \
            michi-server:test

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: container did not become healthy within timeout"
            docker logs michi-test
            exit 1
          fi

          curl -fsS http://127.0.0.1:9090/health/live >/dev/null
          curl -fsS http://127.0.0.1:9090/api/v1/status >/dev/null
          curl -fsS http://127.0.0.1:9090/ >/dev/null
          python3 tests/e2e/test_player_micro_contract_compatibility.py \
            --url http://127.0.0.1:9090 \
            --username admin \
            --password admin123


  ci-arm64-qemu:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-web-ui-browser-e2e, ci-three-way-ecosystem]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: michi-server:arm64
      - name: Verify ARM64 runtime and Player Contract under QEMU
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f michi-arm64 >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d \
            --name michi-arm64 \
            -p 9091:9091 \
            --tmpfs /music:rw,uid=1000,gid=1000,mode=0775 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e MICHI_PORT=9091 \
            -e MICHI_AUTH_USERNAME=admin \
            -e MICHI_AUTH_PASSWORD=admin123 \
            michi-server:arm64

          READY=0

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9091/health/live >/dev/null 2>&1; then
              READY=1
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx michi-arm64; then
              echo "FAIL: ARM64 container terminated before becoming healthy"
              docker logs michi-arm64 || true
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAIL: ARM64 container did not become healthy within timeout"
            docker logs michi-arm64 || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:9091/health/live >/dev/null
          curl -fsS http://127.0.0.1:9091/api/v1/status >/dev/null
          curl -fsS http://127.0.0.1:9091/ >/dev/null

          docker exec michi-arm64 sh -lc '
            echo "Effective runtime:"
            id
            echo "/music ownership:"
            stat -c "%u:%g %a" /music
            echo "Writable /music check:"
            touch /music/.ci-write-test
            rm /music/.ci-write-test
          '

          python3 tests/e2e/test_player_micro_contract_compatibility.py \
            --url http://127.0.0.1:9091 \
            --username admin \
            --password admin123


  release-ghcr:
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-web-ui-browser-e2e, ci-three-way-ecosystem, ci-docker-amd64, ci-arm64-qemu]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Build and push multi-arch release
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
