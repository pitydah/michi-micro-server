  ci-short-stability-smoke:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: Build release server
        run: cargo build --release --bin michi-server
      - name: Run short stability soak
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/michi-short-soak"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/config" "$ROOT/cache" "$ROOT/music"

          export MICHI_PORT=9101
          export MICHI_CONFIG_PATH="$ROOT/config"
          export MICHI_CACHE_PATH="$ROOT/cache"
          export MICHI_MUSIC_PATH="$ROOT/music"
          export MICHI_DATABASE="sqlite://$ROOT/config/michi.db"
          export MICHI_AUTH_USERNAME=admin
          export MICHI_AUTH_PASSWORD=admin12345

          ./target/release/michi-server &
          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9101/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:9101/health/live >/dev/null

          python3 scripts/soak_test.py \
            --url http://127.0.0.1:9101 \
            --pid "$PID" \
            --config-dir "$ROOT/config" \
            --duration-seconds 90 \
            --sample-interval 2 \
            --username admin \
            --password admin12345 \
            --gate-id short-stability-smoke \
            --evidence-class INTEGRATION_REAL \
            --report target/release-evidence/short-stability-smoke.json
      - name: Upload short stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-short-stability-smoke
          path: target/release-evidence/short-stability-smoke.json
          if-no-files-found: error
          retention-days: 30

