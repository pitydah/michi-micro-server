name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  packages: write

jobs:
  ci-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ci-stream-contract:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch canonical Michi Link contracts (michi-music-stream)
        run: git clone --depth 1 https://github.com/pitydah/michi-music-stream.git /tmp/michi-music-stream
      - name: Validate Michi Link v1-lite Stream Contract Drift & Full OpenAPI
        run: python3 scripts/test_stream_contract_drift.py --contract-dir /tmp/michi-music-stream/contracts/michi-link

  ci-receiver-contract-simulator:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Run Receiver Simulator E2E Integration Tests (Matrix, PIN & Fault Injection)
        run: bash scripts/test_receiver_e2e.sh 8080 8081

  ci-snapcast-contract-mock:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run Snapcast Multi-Client Contract Mock Tests
        run: bash scripts/test_snapcast_e2e.sh 1780

  ci-mqtt-contract-simulator:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Run Home Assistant & MQTT Contract Simulator Tests
        run: bash scripts/test_homeassistant_e2e.sh 18883 18884 9098

  ci-mosquitto-real:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies & Mosquitto broker
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config mosquitto
      - name: Build michi-server binary
        run: cargo build --bin michi-server
      - name: Run Mosquitto Real Integration Tests
        run: bash scripts/test_mosquitto_real_e2e.sh 18885 9098

  ci-generic-linux-appliance:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config sqlite3
      - name: Run Appliance Qualification on Generic Linux Runner
        run: bash scripts/test_appliance_e2e.sh 9092

  ci-reliability-short:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config sqlite3
      - name: Run Master Reliability & Short Stability Smoke Suite
        run: bash scripts/test_reliability_qualification.sh 9089

  ci-web-ui-functional-integrity:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Run Web UI Functional Integrity Suite
        run: cargo test -p michi-api --test web_ui_integrity_tests

  ci-no-test-api-release:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Build release binary
        run: cargo build --release --bin michi-server
      - name: Verify engineering route test_pcm is 404 in release
        run: |
          ./target/release/michi-server &
          PID=$!
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:9090/api/v1/receivers/dummy/stream/test_pcm || true)
          kill $PID || true
          if [ "$STATUS" = "404" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "405" ]; then
            echo "PASS: /stream/test_pcm not reachable as active route in release (status=$STATUS)"
          else
            echo "FAIL: expected 404 in release build, got $STATUS"
            exit 1
          fi

  ci-three-way-ecosystem:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-no-test-api-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Build michi-server binary
        run: cargo build --bin michi-server
      - name: Run Three-Way Ecosystem E2E Integration Suite (Mobile -> Micro -> Stream)
        run: bash scripts/test_three_way_ecosystem.sh 9099 55438 55439

  ci-docker-amd64:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-no-test-api-release, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-three-way-ecosystem]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: michi-server:test
      - name: Smoke test and Player Contract verification
        run: |
          docker run -d --name michi-test -p 9090:9090 \
            -e MICHI_PORT=9090 \
            -e MICHI_AUTH_USERNAME=admin \
            -e MICHI_AUTH_PASSWORD=admin \
            michi-server:test
          sleep 5
          curl -f http://127.0.0.1:9090/health/live || exit 1
          curl -f http://127.0.0.1:9090/api/v1/status || exit 1
          curl -f http://127.0.0.1:9090/ || exit 1
          python3 tests/e2e/test_player_micro_contract_compatibility.py --url http://127.0.0.1:9090 --username admin --password admin || exit 1
          docker stop michi-test
          docker rm michi-test

  ci-arm64-qemu:
    runs-on: ubuntu-latest
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-three-way-ecosystem]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: michi-server:arm64
      - name: Verify ARM64 boot under QEMU
        run: |
          docker run -d --name michi-arm64 -p 9091:9091 \
            -e MICHI_PORT=9091 \
            -e MICHI_AUTH_USERNAME=admin \
            -e MICHI_AUTH_PASSWORD=admin \
            michi-server:arm64
          sleep 10
          curl -f http://127.0.0.1:9091/health/live || exit 1
          curl -f http://127.0.0.1:9091/api/v1/status || exit 1
          docker stop michi-arm64
          docker rm michi-arm64

  release-ghcr:
    needs: [ci-rust, ci-stream-contract, ci-receiver-contract-simulator, ci-snapcast-contract-mock, ci-mqtt-contract-simulator, ci-mosquitto-real, ci-generic-linux-appliance, ci-reliability-short, ci-web-ui-functional-integrity, ci-three-way-ecosystem, ci-docker-amd64, ci-arm64-qemu]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Build and push multi-arch release
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
