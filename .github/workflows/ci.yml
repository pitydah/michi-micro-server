      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: Run Receiver Simulator E2E Integration Tests (Matrix, PIN & Fault Injection)
        run: bash scripts/test_receiver_e2e.sh 8080 8081
      - name: Record release evidence
        if: always()
