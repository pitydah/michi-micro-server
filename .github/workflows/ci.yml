name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  packages: write

jobs:
  ci-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config ffmpeg
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Record release evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate rust-quality \
            --class STATIC_ANALYSIS \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/rust-quality.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-rust-quality
          path: target/release-evidence/rust-quality.json
          if-no-files-found: error
          retention-days: 30

  ci-stream-contract:
    runs-on: ubuntu-latest
    needs: ci-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate Michi Link v1-lite Stream Contract Drift & Full OpenAPI (Pinned Submodule)
        run: python3 scripts/test_stream_contract_drift.py --contract-dir vendor/michi-music-stream/contracts/michi-link
      - name: Record release evidence
        if: always()
        run: |
          python3 scripts/record_job_evidence.py \
            --gate stream-contract \
            --class STATIC_ANALYSIS \
            --job-status "${{ job.status }}" \
            --output target/release-evidence/stream-contract.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-stream-contract
          path: target/release-evidence/stream-contract.json
          if-no-files-found: error
          retention-days: 30

