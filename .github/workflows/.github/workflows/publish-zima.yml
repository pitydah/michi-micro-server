name: Publish ZimaOS Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-zima:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout R3.1-ZIMA baseline
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ZimaOS image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pitydah/michi-micro-server:r3.1-zima
            ghcr.io/pitydah/michi-micro-server:r3.1-zima-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pitydah/michi-micro-server
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
