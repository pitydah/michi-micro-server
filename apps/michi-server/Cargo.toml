[package]
name = "michi-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
michi-api = { path = "../../crates/michi-api" }
michi-config = { path = "../../crates/michi-config" }
michi-db = { path = "../../crates/michi-db" }
michi-homeassistant = { path = "../../crates/michi-homeassistant" }
michi-opensubsonic = { path = "../../crates/michi-opensubsonic" }
michi-identity = { workspace = true }
michi-connect = { path = "../../crates/michi-connect" }

tokio.workspace = true
tokio-util = { workspace = true }
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
sqlx.workspace = true
futures-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile = "2"
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = "0.5"

[features]
default = []
hardware-gate = ["michi-api/hardware-gate"]
